name: Feature request
description: Suggest an enhancement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For an open-ended idea you'd rather discuss before writing a formal request, consider
        starting a Discussion instead (this repository's Discussions tab).

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the platform doesn't support today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        **Check the current scope before filing:**
        - [Product doctrine and strategic direction](https://github.com/michaelegner/architecture-intelligence-platform/blob/main/docs/product-doctrine-and-strategic-direction.md)
        - [Roadmap and current release scope](https://github.com/michaelegner/architecture-intelligence-platform/blob/main/ROADMAP.md)
        - [Specification index and release contracts](https://github.com/michaelegner/architecture-intelligence-platform/blob/main/docs/specifications/README.md)

        Explain how the idea aligns with current scope, or which extension it
        proposes. The original PoC's non-goals do not override shipped features
        or current release specifications.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: >-
        In your proposal, describe how this request fits the current
        evidence-qualified architecture and roadmap, or explain what scope
        extension you would like the maintainers to consider.
      options:
        - label: I reviewed the current scope references and explained alignment or a proposed extension in this request.
          required: true

name: Docker

# H5 spec §27: on release, build the image and publish it to GHCR. Deliberately a single trigger
# (release: published, not also push: tags) - publishing the release publishes the container. Both
# triggers together doubled every build/publish (observed firing twice for v0.1.0-alpha.1: once
# per event), which risked a race on the `latest` tag and wasted CI minutes for no benefit, since
# `gh release create <tag>` always creates the tag as part of publishing the release anyway.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-push:
    name: build, scan, and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # GHCR image names must be lowercase; github.repository preserves the repo's actual case.
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          build-args: |
            AIP_BUILD_REVISION=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest

      # spec §31: container image vulnerability scanning (Trivy). Non-blocking (exit-code 0) -
      # base-image CVEs the maintainer doesn't control shouldn't hard-fail a release build; findings
      # are reviewed via the Security tab instead, mirroring the "reviewed, not necessarily zero"
      # framing of spec §29/§50's "no *unreviewed* critical finding".
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          scan-type: image
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

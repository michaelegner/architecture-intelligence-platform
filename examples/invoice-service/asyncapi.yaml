asyncapi: '2.6.0'
info:
  title: InvoiceService
  version: "1.0.0"
x-aip-service-id: service:invoice-service
servers:
  asb:
    url: amqps://asb.example.com
    protocol: amqp
    x-aip-broker-id: asb
    bindings:
      amqp:
        virtualHost: commerce
channels:
  invoice-q:
    x-aip-destination-kind: "queue"
    subscribe:
      operationId: receiveInvoiceCreated
      message:
        $ref: '#/components/messages/InvoiceCreated'
components:
  messages:
    InvoiceCreated:
      name: InvoiceCreated
      x-version: v1
      payload:
        $ref: '#/components/schemas/InvoiceCreatedPayload'
  schemas:
    InvoiceCreatedPayload:
      type: object
      properties:
        invoiceId:
          type: string
        amount:
          type: number
      required: [invoiceId, amount]

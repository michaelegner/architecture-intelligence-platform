# Operator-authored AsyncAPI overlay for the v0.6.2 Pitstop demo - NOT an upstream document.
# Pitstop ships no AsyncAPI; see ../../PROVENANCE.md. CustomerManagementAPI publishes CustomerRegistered to the fanout
# exchange `Pitstop` (src/CustomerManagementAPI/Controllers/CustomersController.cs:47; exchange declared at
# Infrastructure.Messaging/RabbitMQMessagePublisher.cs:98). No message payload or field is declared.
asyncapi: '2.6.0'
info:
  title: CustomerManagementAPI
  version: "1.0.0"
x-aip-service-id: service:customer-management-api
servers:
  pitstop-rabbitmq:
    url: pitstop-rabbitmq:5672
    protocol: amqp
    x-aip-broker-id: rabbitmq:pitstop-rabbitmq
channels:
  Pitstop:
    x-aip-destination-kind: topic
    publish:
      operationId: publishCustomerManagementAPI

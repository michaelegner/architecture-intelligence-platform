# Operator-authored AsyncAPI overlay for the v0.6.2 Pitstop demo - NOT an upstream document.
# Pitstop ships no AsyncAPI; see ../../PROVENANCE.md. TimeService publishes DayHasPassed to the fanout
# exchange `Pitstop` (src/TimeService/TimeWorker.cs:39; exchange declared at
# Infrastructure.Messaging/RabbitMQMessagePublisher.cs:98). No message payload or field is declared.
asyncapi: '2.6.0'
info:
  title: TimeService
  version: "1.0.0"
x-aip-service-id: service:time-service
servers:
  pitstop-rabbitmq:
    url: pitstop-rabbitmq:5672
    protocol: amqp
    x-aip-broker-id: rabbitmq:pitstop-rabbitmq
channels:
  Pitstop:
    x-aip-destination-kind: topic
    publish:
      operationId: publishTimeService

# Operator-authored AsyncAPI overlay for the v0.6.2 Pitstop demo - NOT an upstream document.
# Pitstop ships no AsyncAPI; see ../../PROVENANCE.md. WorkshopManagementEventHandler consumes the fanout exchange `Pitstop` through
# the durable queue `WorkshopManagement` (src/WorkshopManagementEventHandler/appsettings.Production.json:7; queue declared and bound at
# Infrastructure.Messaging/RabbitMQMessageHandler.cs:94-95). No message payload or field is declared.
asyncapi: '2.6.0'
info:
  title: WorkshopManagementEventHandler
  version: "1.0.0"
x-aip-service-id: service:workshop-management-event-handler
servers:
  pitstop-rabbitmq:
    url: pitstop-rabbitmq:5672
    protocol: amqp
    x-aip-broker-id: rabbitmq:pitstop-rabbitmq
channels:
  Pitstop:
    x-aip-destination-kind: topic
    subscribe:
      operationId: consumeWorkshopManagementEventHandler
      x-aip-subscription-name: WorkshopManagement

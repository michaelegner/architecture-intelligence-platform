# v0.6.2 Pitstop demo stack (spec §4.3, local replay). run.sh is the only caller. It always invokes
# `docker compose -p aip-pitstop-demo --project-directory <repo> -f <this file> --env-file /dev/null`,
# so relative paths resolve from the repository root and no .env or override file can leak in.
# The overlay is mounted read-only and unmodified.
services:
  architecture-intelligence:
    build: .
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${PITSTOP_DEMO_NEO4J_PASSWORD:?set by run.sh}
      OPENAI_API_KEY: ""
      CONFIG_PATH: pitstop/config.yaml
    volumes:
      - ./examples/pitstop-demo/config.yaml:/app/pitstop/config.yaml:ro
      - ./examples/pitstop-demo/check_ready.py:/app/pitstop/check_ready.py:ro
      - ./examples/pitstop-demo/overlay:/app/pitstop/overlay:ro
    ports:
      # 8000 exactly: the default MCP host allowlist is localhost:8000 / 127.0.0.1:8000.
      - "127.0.0.1:8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      interval: 1s

  neo4j:
    image: neo4j:5.26.0@sha256:5a015e53de1895e7eee1574ae0325cf8c4b89587222778108c594bdd45a474b5
    environment:
      NEO4J_AUTH: neo4j/${PITSTOP_DEMO_NEO4J_PASSWORD:?set by run.sh}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 60

  otel-collector:
    image: otel/opentelemetry-collector:0.159.0@sha256:7725a7a10c87d8853208bdd4bb3439ad3c0d7b32b4292b9300ac07c8daba14a2
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./examples/runtime-demo/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      architecture-intelligence:
        condition: service_started

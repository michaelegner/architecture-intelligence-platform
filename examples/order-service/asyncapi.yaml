asyncapi: '2.6.0'
info:
  title: OrderService
  version: "1.0.0"
x-aip-service-id: service:order-service
servers:
  asb:
    url: amqps://asb.example.com
    protocol: amqp
    x-aip-broker-id: asb
    bindings:
      amqp:
        virtualHost: commerce
channels:
  payment-q:
    x-aip-destination-kind: "queue"
    publish:
      operationId: sendPaymentRequested
      message:
        $ref: '#/components/messages/PaymentRequested'
  unused-q:
    x-aip-destination-kind: "queue"
    publish:
      operationId: sendUnusedMessage
      message:
        $ref: '#/components/messages/UnusedMessage'
components:
  messages:
    PaymentRequested:
      name: PaymentRequested
      x-version: v2
      payload:
        $ref: '#/components/schemas/PaymentRequestedPayload'
    UnusedMessage:
      name: UnusedMessage
      payload:
        type: object
  schemas:
    PaymentRequestedPayload:
      type: object
      properties:
        orderId:
          type: string
        amount:
          type: number
      required: [orderId, amount]

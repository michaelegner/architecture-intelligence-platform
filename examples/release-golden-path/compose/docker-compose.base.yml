# v0.5.0 I6 §7.4 release golden-path stack. golden_path.py is the only caller. It always invokes
# `docker compose -p gp-<phase> --project-directory <repo> -f <this file> -f <phase>.yml
# --env-file /dev/null`, so relative paths resolve from the repository root and no .env or
# override file can leak in. Every interpolation is `:?`, with no defaults. Every third-party image
# is pinned by digest. The AIP image is exactly the IMAGE_REF under test, and it is never built here.
services:
  architecture-intelligence:
    image: ${GP_IMAGE:?set by golden_path.py from IMAGE_REF}
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${GP_NEO4J_PASSWORD:?set by golden_path.py per run}
      OPENAI_API_KEY: ""
      CONFIG_PATH: ${GP_CONFIG_PATH:?set by golden_path.py from the phase}
    ports:
      # 8000 exactly: the default MCP host allowlist is localhost:8000 / 127.0.0.1:8000.
      - "127.0.0.1:8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:5.26.0@sha256:5a015e53de1895e7eee1574ae0325cf8c4b89587222778108c594bdd45a474b5
    environment:
      NEO4J_AUTH: neo4j/${GP_NEO4J_PASSWORD:?set by golden_path.py per run}
    ports:
      # Read-only graph-fact checks (pubsub phase) connect here. A non-default port avoids a
      # developer's own Neo4j on 7687.
      - "127.0.0.1:17687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 60

  otel-collector:
    image: otel/opentelemetry-collector:0.159.0@sha256:7725a7a10c87d8853208bdd4bb3439ad3c0d7b32b4292b9300ac07c8daba14a2
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./examples/runtime-demo/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      architecture-intelligence:
        condition: service_started

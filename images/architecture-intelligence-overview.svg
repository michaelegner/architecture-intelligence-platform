<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="Evidence-backed architecture intelligence: declared OpenAPI, AsyncAPI and architecture.yaml plus observed OpenTelemetry feed an evidence-backed architecture model, which exposes facts, evidence and qualification with provenance. Know what the architecture is — and the evidence behind it.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#ffffff"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <text x="600" y="62" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">Evidence-backed Architecture Intelligence</text>
    <text x="600" y="100" text-anchor="middle" font-size="20" fill="#475569">Know what the architecture is — and the evidence behind it.</text>

    <rect x="90" y="155" width="390" height="120" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="285" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#2563eb">DECLARED</text>
    <text x="285" y="224" text-anchor="middle" font-size="18" fill="#0f172a">OpenAPI · AsyncAPI</text>
    <text x="285" y="251" text-anchor="middle" font-size="18" fill="#0f172a">architecture.yaml</text>

    <rect x="720" y="155" width="390" height="120" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="915" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#b45309">OBSERVED</text>
    <text x="915" y="232" text-anchor="middle" font-size="18" fill="#0f172a">OpenTelemetry</text>

    <line x1="390" y1="275" x2="545" y2="342" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="810" y1="275" x2="655" y2="342" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="370" y="335" width="460" height="110" rx="16" fill="#eef2ff" stroke="#94a3b8" stroke-width="2"/>
    <text x="600" y="377" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">EVIDENCE-BACKED</text>
    <text x="600" y="408" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">ARCHITECTURE MODEL</text>

    <line x1="600" y1="445" x2="600" y2="488" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="115" y="500" width="270" height="78" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="250" y="548" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">FACTS</text>

    <rect x="465" y="500" width="270" height="78" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="548" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">EVIDENCE</text>

    <rect x="815" y="500" width="270" height="78" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="950" y="535" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">QUALIFICATION</text>
    <text x="950" y="560" text-anchor="middle" font-size="16" fill="#475569">&amp; PROVENANCE</text>

    <line x1="600" y1="488" x2="250" y2="500" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="600" y1="488" x2="950" y2="500" stroke="#cbd5e1" stroke-width="2"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" role="img" aria-label="Declared OpenAPI, AsyncAPI and architecture.yaml and observed OpenTelemetry feed an evidence-backed architecture model. The model exposes facts, evidence and provenance, and qualification as Architecture Intelligence. Know what the architecture is — and the evidence behind it.">
  <defs>
    <linearGradient id="blueBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="orangeBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf2"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="modelBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0b46bc"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#d98b00"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#173b73" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1672" height="941" fill="#ffffff"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <!-- DECLARED -->
    <rect x="110" y="28" width="655" height="235" rx="18" fill="url(#blueBox)" stroke="#1555c0" stroke-width="2.5" filter="url(#soft)"/>
    <circle cx="262" cy="81" r="43" fill="#114fbd"/>
    <path d="M244 57h31l14 14v36h-45z" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
    <path d="M275 57v16h14M254 86l-8 8 8 8M276 86l8 8-8 8M266 84l-5 20" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="345" y="100" font-size="51" font-weight="700" fill="#114fbd">DECLARED</text>

    <text x="215" y="176" font-size="31" font-weight="700" fill="#114fbd" text-anchor="middle">{ API }</text>
    <text x="215" y="234" font-size="28" font-weight="700" fill="#0a1530" text-anchor="middle">OpenAPI</text>
    <line x1="317" y1="142" x2="317" y2="220" stroke="#9db9e9" stroke-width="2"/>

    <path d="M395 169c17-20 40-21 55-6l-10 10c-10-9-22-9-32 3-10 12-10 25 1 35 11 10 24 8 34-4l10 9c-17 21-43 24-61 7-18-17-17-39 3-54z" fill="none" stroke="#1555c0" stroke-width="4"/>
    <path d="M430 153l14 18 17-14" fill="none" stroke="#1555c0" stroke-width="4" stroke-linecap="round"/>
    <text x="417" y="234" font-size="28" font-weight="700" fill="#0a1530" text-anchor="middle">AsyncAPI</text>
    <line x1="519" y1="142" x2="519" y2="220" stroke="#9db9e9" stroke-width="2"/>

    <path d="M611 143h42l18 18v53h-60z" fill="none" stroke="#1555c0" stroke-width="4" stroke-linejoin="round"/>
    <path d="M653 143v20h18M622 178h37M622 191h32" fill="none" stroke="#1555c0" stroke-width="3" stroke-linecap="round"/>
    <text x="640" y="234" font-size="27" font-weight="700" fill="#0a1530" text-anchor="middle">architecture.yaml</text>

    <!-- OBSERVED -->
    <rect x="880" y="28" width="654" height="235" rx="18" fill="url(#orangeBox)" stroke="#d98b00" stroke-width="2.5" filter="url(#soft)"/>
    <circle cx="1051" cy="81" r="43" fill="#dc9400"/>
    <circle cx="1034" cy="89" r="6" fill="#fff"/>
    <circle cx="1048" cy="69" r="6" fill="#fff"/>
    <circle cx="1065" cy="58" r="6" fill="#fff"/>
    <line x1="1034" y1="89" x2="1048" y2="69" stroke="#fff" stroke-width="4"/>
    <line x1="1048" y1="69" x2="1065" y2="58" stroke="#fff" stroke-width="4"/>
    <line x1="1032" y1="99" x2="1032" y2="109" stroke="#fff" stroke-width="5"/>
    <line x1="1047" y1="86" x2="1047" y2="109" stroke="#fff" stroke-width="5"/>
    <line x1="1062" y1="76" x2="1062" y2="109" stroke="#fff" stroke-width="5"/>
    <line x1="1077" y1="68" x2="1077" y2="109" stroke="#fff" stroke-width="5"/>
    <text x="1128" y="100" font-size="51" font-weight="700" fill="#9b5e00">OBSERVED</text>

    <g transform="translate(1187 157) rotate(-43)">
      <rect x="-11" y="-26" width="22" height="52" rx="4" fill="#dc9400"/>
      <rect x="-17" y="-37" width="34" height="14" rx="3" fill="#dc9400"/>
      <rect x="-17" y="23" width="34" height="14" rx="3" fill="#dc9400"/>
      <circle cx="0" cy="0" r="6" fill="#fff"/>
    </g>
    <text x="1207" y="234" font-size="29" font-weight="700" fill="#0a1530" text-anchor="middle">OpenTelemetry</text>

    <!-- arrows to model -->
    <path d="M423 263v15c0 18 12 25 31 25h219c17 0 21 8 21 29" fill="none" stroke="#0b46bc" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <path d="M1185 263v15c0 18-12 25-31 25H975c-17 0-21 8-21 29" fill="none" stroke="#d98b00" stroke-width="4" marker-end="url(#arrowOrange)"/>

    <!-- Model -->
    <rect x="372" y="333" width="900" height="164" rx="18" fill="url(#modelBox)" stroke="#1555c0" stroke-width="2.5" filter="url(#soft)"/>
    <path d="M515 362l45 18v34c0 32-18 50-45 62-27-12-45-30-45-62v-34z" fill="none" stroke="#1555c0" stroke-width="6"/>
    <path d="M493 416l16 17 30-35" fill="none" stroke="#1555c0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="616" y="410" font-size="51" font-weight="700" fill="#0a2d67">EVIDENCE-BACKED</text>
    <text x="616" y="465" font-size="51" font-weight="700" fill="#0a2d67">ARCHITECTURE MODEL</text>

    <!-- branch to facts/evidence/qualification -->
    <path d="M823 497v31H411v34" fill="none" stroke="#0b46bc" stroke-width="3.5" marker-end="url(#arrowBlue)"/>
    <path d="M823 497v65" fill="none" stroke="#0b46bc" stroke-width="3.5" marker-end="url(#arrowBlue)"/>
    <path d="M823 528h411v34" fill="none" stroke="#0b46bc" stroke-width="3.5" marker-end="url(#arrowBlue)"/>

    <!-- Facts -->
    <rect x="246" y="563" width="360" height="113" rx="16" fill="#fbfdff" stroke="#69a2ef" stroke-width="2.2"/>
    <path d="M298 585h35l14 14v52h-49z" fill="none" stroke="#1555c0" stroke-width="4" stroke-linejoin="round"/>
    <path d="M333 585v16h14M307 614h25M307 628h19" fill="none" stroke="#1555c0" stroke-width="3" stroke-linecap="round"/>
    <circle cx="348" cy="635" r="17" fill="#fff" stroke="#1555c0" stroke-width="4"/>
    <path d="M339 635l7 7 12-15" fill="none" stroke="#1555c0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="404" y="632" font-size="36" font-weight="700" fill="#0a2d67">Facts</text>

    <!-- Evidence & provenance -->
    <rect x="629" y="563" width="387" height="113" rx="16" fill="#fbfdff" stroke="#69a2ef" stroke-width="2.2"/>
    <circle cx="703" cy="616" r="30" fill="none" stroke="#1555c0" stroke-width="4"/>
    <circle cx="690" cy="621" r="5" fill="#1555c0"/>
    <circle cx="704" cy="606" r="5" fill="#1555c0"/>
    <circle cx="718" cy="620" r="5" fill="#1555c0"/>
    <line x1="694" y1="617" x2="700" y2="610" stroke="#1555c0" stroke-width="3"/>
    <line x1="708" y1="610" x2="714" y2="617" stroke="#1555c0" stroke-width="3"/>
    <line x1="724" y1="639" x2="744" y2="659" stroke="#1555c0" stroke-width="7" stroke-linecap="round"/>
    <text x="765" y="613" font-size="34" font-weight="700" fill="#0a2d67">Evidence &amp;</text>
    <text x="765" y="651" font-size="34" font-weight="700" fill="#0a2d67">Provenance</text>

    <!-- Qualification -->
    <rect x="1040" y="563" width="360" height="113" rx="16" fill="#fbfdff" stroke="#69a2ef" stroke-width="2.2"/>
    <path d="M1111 584l10 8 13-1 6 12 12 6-2 13 6 11-9 10-2 13-13 2-11 7-10-8-13 1-6-12-12-6 2-13-6-11 9-10 2-13 13-2z" fill="none" stroke="#1555c0" stroke-width="3"/>
    <path d="M1106 663l-7 17 17-7 10 11 5-22M1136 661l9 20 8-10 14 4-10-22" fill="none" stroke="#1555c0" stroke-width="3"/>
    <path d="M1118 606l5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2z" fill="#1555c0"/>
    <text x="1171" y="632" font-size="34" font-weight="700" fill="#0a2d67">Qualification</text>

    <!-- arrow down -->
    <path d="M823 676v29" fill="none" stroke="#0b46bc" stroke-width="3.5" marker-end="url(#arrowBlue)"/>

    <!-- Architecture Intelligence -->
    <rect x="241" y="713" width="1164" height="109" rx="16" fill="#fbfdff" stroke="#1555c0" stroke-width="2.5" filter="url(#soft)"/>
    <path d="M348 750c0-21 16-37 36-37s36 16 36 37c0 15-8 24-18 32-6 5-8 9-8 15h-20c0-6-2-10-8-15-10-8-18-17-18-32z" fill="none" stroke="#1555c0" stroke-width="4"/>
    <line x1="374" y1="805" x2="394" y2="805" stroke="#1555c0" stroke-width="4" stroke-linecap="round"/>
    <line x1="384" y1="698" x2="384" y2="685" stroke="#1555c0" stroke-width="3" stroke-linecap="round"/>
    <line x1="348" y1="709" x2="339" y2="699" stroke="#1555c0" stroke-width="3" stroke-linecap="round"/>
    <line x1="420" y1="709" x2="429" y2="699" stroke="#1555c0" stroke-width="3" stroke-linecap="round"/>
    <text x="441" y="789" font-size="56" font-weight="700" fill="#0a2d67">ARCHITECTURE INTELLIGENCE</text>

    <!-- tagline -->
    <text x="836" y="884" text-anchor="middle" font-size="39" font-style="italic" font-weight="600" fill="#0a2d67">
      Know what the architecture is — and <tspan fill="#1555c0">the evidence behind it.</tspan>
    </text>
  </g>
</svg>

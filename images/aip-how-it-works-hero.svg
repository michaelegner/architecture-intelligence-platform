<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc">
<title id="title">How AIP works</title>
<desc id="desc">Source repositories, API contracts, runtime observations and architecture documentation flow into AIP, which provides a binding picture, current state and evidence-qualified answers.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f1f7ff"/></linearGradient>
 <linearGradient id="hub" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#eaf5ff"/></linearGradient>
 <filter id="sh" x="-20%" y="-30%" width="150%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#28467f" flood-opacity=".10"/></filter>
 <style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#071537}.head{font-size:66px;font-weight:800}.sub{font-size:24px;fill:#526382}.lab{font-size:25px;font-weight:650}.small{font-size:22px;fill:#526382}.card{fill:white;stroke:#e7edf7;stroke-width:1.5;filter:url(#sh)}.line{fill:none;stroke-width:3.5;stroke-linecap:round}.dot{stroke:white;stroke-width:3}</style>
</defs>
<rect width="1440" height="790" fill="url(#bg)"/>

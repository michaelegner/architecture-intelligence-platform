asyncapi: '2.6.0'
info:
  title: payment-worker-a
  version: "1.0.0"
x-aip-service-id: service:payment-worker-a
servers:
  sb:
    url: amqps://commerce.servicebus.windows.net
    protocol: amqp
    x-aip-broker-id: azure-sb:commerce
channels:
  payments:
    x-aip-destination-kind: queue
    subscribe:
      operationId: receivePaymentRequested
      message:
        $ref: '#/components/messages/PaymentRequested'
components:
  messages:
    PaymentRequested:
      name: PaymentRequested
      x-version: v1
      payload:
        type: object
        properties:
          orderId:
            type: string

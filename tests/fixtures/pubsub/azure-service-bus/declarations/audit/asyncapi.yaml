asyncapi: '2.6.0'
info:
  title: audit
  version: "1.0.0"
x-aip-service-id: service:audit
servers:
  sb:
    url: amqps://commerce.servicebus.windows.net
    protocol: amqp
    x-aip-broker-id: azure-sb:commerce
channels:
  order-events:
    x-aip-destination-kind: topic
    subscribe:
      operationId: receiveOrderPlaced
      x-aip-subscription-name: audit
      message:
        $ref: '#/components/messages/OrderPlaced'
components:
  messages:
    OrderPlaced:
      name: OrderPlaced
      x-version: v1
      payload:
        type: object
        properties:
          orderId:
            type: string

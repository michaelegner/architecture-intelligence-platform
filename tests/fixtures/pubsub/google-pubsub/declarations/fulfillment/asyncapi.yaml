asyncapi: '2.6.0'
info:
  title: fulfillment
  version: "1.0.0"
x-aip-service-id: service:fulfillment
servers:
  gcp:
    url: pubsub.googleapis.com
    protocol: googlepubsub
    x-aip-broker-id: gcp-pubsub:projects/shop
channels:
  orders:
    x-aip-destination-kind: topic
    subscribe:
      operationId: fulfilOrder
      x-aip-subscription-name: fulfillment
      x-aip-subscription-dead-letter:
        target: orders-dead-letter
        targetKind: topic
      message:
        $ref: '#/components/messages/OrderCreated'
components:
  messages:
    OrderCreated:
      name: OrderCreated
      x-version: v1
      payload:
        type: object
        properties:
          id:
            type: string

# Caller Workload orders-canary (I1 capture runbook §§2-3): a separate Deployment of the same image with
# service.name=orders, calling legacy-pricing. k8s.pod.uid, the Pod name and namespace come from the Downward
# API; k8s.cluster.uid is the kube-system Namespace UID, substituted at apply time (2fe6677a-390d-458c-9e4c-85ae44b62f91).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-canary
  namespace: aip-locality
  annotations: {architecture-intelligence.io/service-id: "service:orders"}
spec:
  replicas: 1
  selector: {matchLabels: {app: orders-canary}}
  template:
    metadata: {labels: {app: orders-canary}}
    spec:
      containers:
        - name: orders
          image: aip-locality-harness:20261005t060050z-4392
          imagePullPolicy: Never
          env:
            - {name: ROLE, value: caller}
            - {name: TARGET, value: legacy-pricing}
            - {name: TARGET_PEER_SERVICE, value: legacy-pricing}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: OTEL_SERVICE_NAME, value: orders}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment.name=locality-capture,k8s.pod.uid=$(POD_UID),k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.deployment.name=orders-canary,k8s.cluster.uid=2fe6677a-390d-458c-9e4c-85ae44b62f91"
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318"}
            - {name: OTEL_SEMCONV_STABILITY_OPT_IN, value: http}

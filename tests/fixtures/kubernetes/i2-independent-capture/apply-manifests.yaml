apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime-demo
  namespace: aip-runtime-demo
  labels:
    app: runtime-demo
  annotations:
    architecture-intelligence.io/service-id: "service:runtime-demo"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runtime-demo
  template:
    metadata:
      labels:
        app: runtime-demo
    spec:
      containers:
        - name: runtime-demo
          image: aip-runtime-demo:i2-capture
          imagePullPolicy: IfNotPresent
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.aip-runtime-demo.svc.cluster.local:4318"
            - name: AIP_BASE_URL
              value: "http://architecture-intelligence.aip-runtime-demo.svc.cluster.local:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: runtime-demo
  namespace: aip-runtime-demo
spec:
  type: ClusterIP
  selector:
    app: runtime-demo
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: runtime-demo
  namespace: aip-runtime-demo
spec:
  rules:
    - host: runtime-demo.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: runtime-demo
                port:
                  number: 8080

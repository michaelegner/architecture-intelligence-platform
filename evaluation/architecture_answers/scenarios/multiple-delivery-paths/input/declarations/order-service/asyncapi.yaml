asyncapi: 2.6.0
info:
  title: OrderService
  version: 1.0.0
channels:
  product-events-q:
    publish:
      operationId: sendProductEvent
      message:
        $ref: '#/components/messages/ProductEvent'
    x-aip-destination-kind: queue
components:
  messages:
    ProductEvent:
      name: ProductEvent
      payload:
        $ref: '#/components/schemas/ProductEventPayload'
  schemas:
    ProductEventPayload:
      type: object
      properties:
        productId:
          type: string
      required:
      - productId
x-aip-service-id: service:order-service
servers:
  asb:
    url: amqps://asb.example.com
    protocol: amqp
    x-aip-broker-id: asb
    bindings:
      amqp:
        virtualHost: commerce

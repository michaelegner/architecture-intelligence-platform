scenario: multiple-delivery-paths
description: >
  order-service depends on product-service through two independent delivery paths - a declared
  CALLS/PROVIDES HTTP path and a declared SENDS/RECEIVES_FROM messaging path - both must survive as
  distinct claims, never collapsed into one (spec §13.3, required semantic anchor spec §23).


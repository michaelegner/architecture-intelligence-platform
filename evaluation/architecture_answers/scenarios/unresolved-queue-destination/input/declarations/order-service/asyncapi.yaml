asyncapi: 2.6.0
info:
  title: OrderService
  version: 1.0.0
channels:
  unused-q:
    publish:
      operationId: sendUnusedMessage
      message:
        $ref: '#/components/messages/UnusedMessage'
    x-aip-destination-kind: queue
components:
  messages:
    UnusedMessage:
      name: UnusedMessage
      payload:
        type: object
x-aip-service-id: service:order-service
servers:
  asb:
    url: amqps://asb.example.com
    protocol: amqp
    x-aip-broker-id: asb
    bindings:
      amqp:
        virtualHost: commerce

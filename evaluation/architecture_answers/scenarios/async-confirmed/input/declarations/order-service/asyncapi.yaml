asyncapi: '2.6.0'
info:
  title: OrderService
  version: "1.0.0"
channels:
  payment-q:
    publish:
      operationId: sendPaymentRequested
      message:
        $ref: '#/components/messages/PaymentRequested'
components:
  messages:
    PaymentRequested:
      name: PaymentRequested
      payload:
        $ref: '#/components/schemas/PaymentRequestedPayload'
  schemas:
    PaymentRequestedPayload:
      type: object
      properties:
        orderId:
          type: string
      required: [orderId]

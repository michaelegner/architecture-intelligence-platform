asyncapi: 2.6.0
info:
  title: AuditService
  version: 1.0.0
channels:
  audit-events-q:
    subscribe:
      operationId: receiveAuditEvent
      message:
        $ref: '#/components/messages/AuditEvent'
    x-aip-destination-kind: queue
components:
  messages:
    AuditEvent:
      name: AuditEvent
      payload:
        $ref: '#/components/schemas/AuditEventPayload'
  schemas:
    AuditEventPayload:
      type: object
      properties:
        eventId:
          type: string
      required:
      - eventId
x-aip-service-id: service:audit-service
servers:
  asb:
    url: amqps://asb.example.com
    protocol: amqp
    x-aip-broker-id: asb
    bindings:
      amqp:
        virtualHost: commerce

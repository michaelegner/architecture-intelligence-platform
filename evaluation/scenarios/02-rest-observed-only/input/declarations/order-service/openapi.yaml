openapi: 3.1.0
info:
  title: OrderService
  version: "1.0.0"
paths:
  /orders:
    post:
      operationId: createOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
components:
  schemas:
    OrderRequest:
      type: object
      properties:
        productId:
          type: string
      required: [productId]
    Order:
      type: object
      properties:
        id:
          type: string
      required: [id]

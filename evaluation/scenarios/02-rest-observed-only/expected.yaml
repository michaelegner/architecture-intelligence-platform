scenario: rest-observed-only

description: >
  OrderService calls ProductService's GET /prices at runtime, but no declared CALLS evidence exists
  for it anywhere. ProductService still declares/provides the operation, but PROVIDES must not be
  mistaken for a declared caller relationship.

scope:
  entities:
    - service:order-service
    - service:product-service
    - operation:service:product-service:GET:/prices
  relation_types:
    - CALLS

observation:
  environment: test
  window:
    start: "2026-08-01T10:00:00Z"
    end: "2026-08-01T11:00:00Z"

expected:
  relations:
    - type: CALLS
      source: service:order-service
      target: operation:service:product-service:GET:/prices
      status: OBSERVED_ONLY
      evidence:
        declared: false
        observed: true

forbidden:
  relations: []

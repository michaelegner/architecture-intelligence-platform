asyncapi: 2.6.0
info:
  title: OrderService
  version: 1.0.0
channels:
  audit-q:
    publish:
      operationId: sendAudit
      message:
        $ref: '#/components/messages/AuditMessage'
    x-aip-destination-kind: queue
components:
  messages:
    AuditMessage:
      name: AuditMessage
      payload:
        type: object
x-aip-service-id: service:order-service
servers:
  asb:
    url: amqps://asb.example.com
    protocol: amqp
    x-aip-broker-id: asb
    bindings:
      amqp:
        virtualHost: commerce

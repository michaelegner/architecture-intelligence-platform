openapi: 3.1.0
info:
  title: InventoryService
  version: "1.0.0"
paths:
  /inventory/{id}:
    get:
      operationId: getInventory
      summary: Get inventory status by product id
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inventory"
components:
  schemas:
    Inventory:
      type: object
      properties:
        id:
          type: string
        quantity:
          type: integer
      required: [id, quantity]

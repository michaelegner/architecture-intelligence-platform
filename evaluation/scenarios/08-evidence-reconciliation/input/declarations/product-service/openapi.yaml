openapi: 3.1.0
info:
  title: ProductService
  version: "1.0.0"
paths:
  /products/{id}:
    get:
      operationId: getProduct
      summary: Get a product by id
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
      required: [id, name, price]

asyncapi: 2.6.0
info:
  title: OrderService
  version: 1.0.0
channels:
  request-q:
    publish:
      operationId: sendRequest
      message:
        $ref: '#/components/messages/RequestMessage'
    x-aip-destination-kind: queue
  response-q:
    subscribe:
      operationId: receiveResponse
      message:
        $ref: '#/components/messages/ResponseMessage'
    x-aip-destination-kind: queue
components:
  messages:
    RequestMessage:
      name: RequestMessage
      payload:
        type: object
    ResponseMessage:
      name: ResponseMessage
      payload:
        type: object
x-aip-service-id: service:order-service
servers:
  asb:
    url: amqps://asb.example.com
    protocol: amqp
    x-aip-broker-id: asb
    bindings:
      amqp:
        virtualHost: commerce

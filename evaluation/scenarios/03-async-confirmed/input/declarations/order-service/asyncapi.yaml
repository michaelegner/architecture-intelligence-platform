asyncapi: 2.6.0
info:
  title: OrderService
  version: 1.0.0
channels:
  order-events-q:
    publish:
      operationId: sendOrderEvent
      message:
        $ref: '#/components/messages/OrderEvent'
    x-aip-destination-kind: queue
components:
  messages:
    OrderEvent:
      name: OrderEvent
      x-version: v1
      payload:
        $ref: '#/components/schemas/OrderEventPayload'
  schemas:
    OrderEventPayload:
      type: object
      properties:
        orderId:
          type: string
      required:
      - orderId
x-aip-service-id: service:order-service
servers:
  asb:
    url: amqps://asb.example.com
    protocol: amqp
    x-aip-broker-id: asb
    bindings:
      amqp:
        virtualHost: commerce

asyncapi: '2.6.0'
info:
  title: payment-service
  version: "1.0.0"
  description: >-
    Authored for v0.7.1 I4 from hungCS22hcmiu/ecommerce-system@cd65365838ea880185a02e6536fa347439bfa274
    (payment-service internal/kafka/consumer.go:80-81, internal/kafka/producer.go:16-18,
    config/config.go:43, docker-compose.yml:174).
x-aip-service-id: service:payment-service
servers:
  kafka:
    url: kafka:29092
    protocol: kafka
    x-aip-broker-id: kafka:ecommerce-local
channels:
  orders.created:
    x-aip-destination-kind: topic
    subscribe:
      operationId: consumeOrderCreated
      x-aip-consumer-group: payment-service
      message:
        $ref: '#/components/messages/OrderCreated'
  payments.completed:
    x-aip-destination-kind: topic
    publish:
      operationId: publishPaymentCompleted
      message:
        $ref: '#/components/messages/PaymentCompleted'
  payments.failed:
    x-aip-destination-kind: topic
    publish:
      operationId: publishPaymentFailed
      message:
        $ref: '#/components/messages/PaymentFailed'
  payments.dlq:
    x-aip-destination-kind: topic
    publish:
      operationId: publishDeadLetter
      message:
        $ref: '#/components/messages/DeadLetter'
components:
  messages:
    OrderCreated:
      name: OrderCreated
      payload:
        type: object
        properties:
          orderId: {type: string}
          userId: {type: string}
          totalAmount: {type: number}
          items: {type: array}
    PaymentCompleted:
      name: PaymentCompleted
      payload:
        type: object
        properties:
          orderId: {type: string}
          paymentId: {type: string}
          amount: {type: number}
    PaymentFailed:
      name: PaymentFailed
      payload:
        type: object
        properties:
          orderId: {type: string}
          reason: {type: string}
    DeadLetter:
      name: DeadLetter
      payload:
        type: string

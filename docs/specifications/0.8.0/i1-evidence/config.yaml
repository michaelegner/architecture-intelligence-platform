# AIP configuration for the v0.8 I1 C1 replay (I1 spec §8). The deployment copies this package to
# /app/sokol111-v08/. It registers the Redpanda declaration set, the extended Redpanda mapping and
# the C1 capture only: no Kafka broker exists at C1, so the Kafka declaration set is not registered.
# The graph connection comes from the deployment's NEO4J_* environment.
architecture_intelligence:
  sources:
    directories:
      - id: sokol111-declarations-sokol111-local
        root: /app/sokol111-v08/declarations/sokol111-local
    kafka_consumer_state:
      - id: sokol111-kafka
        root: /app/sokol111-v08/c1
        broker_id: kafka:sokol111-local
        environment: local
        consumer_groups:
          - ecommerce-catalog-service
          - ecommerce-category-query-service
          - ecommerce-image-service
          - ecommerce-product-query-service
    kafka_service_mappings:
      - id: sokol111-mapping
        root: /app/sokol111-v08/mapping/sokol111-local
        broker_id: kafka:sokol111-local
        environment: local
  graph:
    uri: bolt://localhost:7687
    database: neo4j
  import:
    openapi: true
    asyncapi: true
    architecture_manifest: true
  llm:
    enabled: false

asyncapi: '2.6.0'
info:
  title: ecommerce-catalog-service
  version: "1.0.0"
  description: >-
    Authored for AIP v0.8 I1 (spec §4) from
    Sokol111/ecommerce-catalog-service-api@7cecb3e1131dbd5199ce25e9cf101d75d3365171
    (pkg/events/topics.go: TopicFor). Broker kafka:sokol111-local: publish operations. The upstream
    contract is protobuf; this AsyncAPI declares Topic identity and producers only, never a
    consumer.
x-aip-service-id: service:ecommerce-catalog-service
servers:
  kafka:
    url: redpanda:29092
    protocol: kafka
    x-aip-broker-id: kafka:sokol111-local
channels:
  catalog.attribute.events:
    x-aip-destination-kind: topic
    publish:
      operationId: publishAttributeEvents
      message:
        $ref: '#/components/messages/AttributeUpdatedEvent'
  catalog.category.events:
    x-aip-destination-kind: topic
    publish:
      operationId: publishCategoryEvents
      message:
        $ref: '#/components/messages/CategoryUpdatedEvent'
  catalog.product.events:
    x-aip-destination-kind: topic
    publish:
      operationId: publishProductEvents
      message:
        oneOf:
          - $ref: '#/components/messages/ProductUpdatedEvent'
          - $ref: '#/components/messages/ProductDeletedEvent'
components:
  messages:
    AttributeUpdatedEvent:
      name: AttributeUpdatedEvent
    CategoryUpdatedEvent:
      name: CategoryUpdatedEvent
    ProductDeletedEvent:
      name: ProductDeletedEvent
    ProductUpdatedEvent:
      name: ProductUpdatedEvent

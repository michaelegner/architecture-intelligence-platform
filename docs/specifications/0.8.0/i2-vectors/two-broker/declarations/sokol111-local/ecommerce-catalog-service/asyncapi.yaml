asyncapi: '2.6.0'
info:
  title: ecommerce-catalog-service
  version: "1.0.0"
  description: >-
    Authored for the AIP v0.8 I2 two-broker fixture (I2 spec §8.2; I1 spec §4.1 rules) from
    Sokol111/ecommerce-catalog-service-api@7cecb3e1131dbd5199ce25e9cf101d75d3365171
    (pkg/events/topics.go: TopicFor). Broker kafka:sokol111-local: topic-only channels (after wave 1
    this broker carries a MirrorMaker 2 copy, no Service writes it). The upstream contract is
    protobuf; this AsyncAPI declares Topic identity and producers only, never a consumer.
x-aip-service-id: service:ecommerce-catalog-service
servers:
  kafka:
    url: redpanda:29092
    protocol: kafka
    x-aip-broker-id: kafka:sokol111-local
channels:
  catalog.attribute.events:
    x-aip-destination-kind: topic
  catalog.category.events:
    x-aip-destination-kind: topic
  catalog.product.events:
    x-aip-destination-kind: topic

# v0.8 I3 (D13, §3 worker-state table): Flow A: Redpanda -> Kafka, tenant.tenant.events, with group-offset sync for Catalog and Image.
# Authored for the showcase. Keys checked against MirrorMakerConfig at apache/kafka 4.1.2.
clusters = redpanda, kafka
redpanda.bootstrap.servers = redpanda:29092
kafka.bootstrap.servers = kafka:29092
redpanda->kafka.enabled = true
kafka->redpanda.enabled = false
redpanda->kafka.topics = tenant\\.tenant\\.events
redpanda->kafka.groups = ecommerce-catalog-service, ecommerce-image-service
sync.group.offsets.enabled = true
# Connect worker state of this flow only (never shared): group and internal topics on the target.
kafka.group.id = mm2-flow-a
config.storage.topic = mm2-flow-a-configs
offset.storage.topic = mm2-flow-a-offsets
status.storage.topic = mm2-flow-a-status
replication.policy.class = org.apache.kafka.connect.mirror.IdentityReplicationPolicy
emit.checkpoints.enabled = true
emit.offset-syncs.enabled = true
emit.heartbeats.enabled = false
sync.topic.configs.enabled = false
sync.topic.acls.enabled = false
# Explicit demo cadence (the Kafka 4.1 defaults are 600 s / 60 s). The step 6 and P5 deadlines
# derive from these values (harness/v08/i3/lib.sh).
refresh.topics.interval.seconds = 10
refresh.groups.interval.seconds = 10
emit.checkpoints.interval.seconds = 10
sync.group.offsets.interval.seconds = 10
offset.lag.max = 1
# Connect commits the replicated source offsets at this cadence (default 60 s).
offset.flush.interval.ms = 10000
# Single-node clusters: replication factor 1 for mirrored data topics (default 2) and every internal topic.
replication.factor = 1
checkpoints.topic.replication.factor = 1
offset-syncs.topic.replication.factor = 1
heartbeats.topic.replication.factor = 1
config.storage.replication.factor = 1
offset.storage.replication.factor = 1
status.storage.replication.factor = 1

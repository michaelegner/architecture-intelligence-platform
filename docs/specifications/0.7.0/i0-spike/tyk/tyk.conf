{
  "listen_port": 8080,
  "secret": "spike-admin-secret",
  "node_secret": "spike-node-secret",
  "storage": {
    "type": "redis",
    "host": "redis",
    "port": 6379,
    "database": 0
  },
  "app_path": "/opt/tyk-gateway/apps/",
  "use_db_app_configs": false,
  "enable_analytics": false,
  "hash_keys": true,
  "opentelemetry": {
    "metrics": {
      "enabled": true,
      "exporter": "grpc",
      "endpoint": "otel:4317",
      "connection_timeout": 5,
      "resource_name": "tyk-spike",
      "export_interval": 5,
      "api_metrics": [
        {
          "name": "tyk.spike.requests.total",
          "type": "counter",
          "description": "per key alias",
          "dimensions": [
            {
              "source": "metadata",
              "key": "api_id",
              "label": "api_id"
            },
            {
              "source": "metadata",
              "key": "response_code",
              "label": "code"
            },
            {
              "source": "session",
              "key": "alias",
              "label": "key_alias",
              "default": "unattributed"
            }
          ]
        }
      ]
    }
  },
  "template_path": "/opt/tyk-gateway/templates",
  "policies": {
    "policy_source": "file",
    "policy_record_name": "/opt/tyk-gateway/policies/policies.json"
  },
  "enable_hashed_keys_listing": true
}
# Quarkus Super Heroes I2 validation profile (I2 spec §7/§17, runbook.md phases 3-6).
#
# Env wiring for the infra services and each pinned service's datasource/Stork/Kafka/Apicurio
# configuration is carried over unchanged from the pinned repository's own CI-generated
# deploy/docker-compose/java25.yml - none of that depends on which exact commit is built.
#
# Two things are deliberately NOT copied from that official compose file:
#
#   1. Images are LOCAL, pinned-SHA-tagged builds (quarkus-super-heroes/<service>:8ea0337), never
#      quay.io/quarkus-super-heroes/<service>:java25-latest - that tag is a rolling build that does
#      not reliably represent our exact pinned commit (runtime/README.md explains why). runbook.md
#      phase 3 builds these images from ${QUARKUS_SUPERHEROES_CHECKOUT} before this file is used.
#   2. QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT points at our own otel-collector (defined below),
#      not the upstream demo's otel-lgtm stack, and QUARKUS_OTEL_RESOURCE_ATTRIBUTES appends
#      deployment.environment.name=quarkus-i2 to each service's own existing attribute string
#      (an env var config override REPLACES the whole property, so the original app=/application=/
#      system= values are repeated here, not merged automatically).
#
# ${QUARKUS_SUPERHEROES_CHECKOUT} = a local clone of quarkusio/quarkus-super-heroes checked out at
# 8ea03377bfe7a89c49e1ccc0e501bf5fafbc2cce (runbook.md phase 2) - never vendored into this repo
# (I1 spec §36/§39).

services:

  # --- AIP itself (mirrors docker-compose.demo.yml's architecture-intelligence/neo4j services) ---

  architecture-intelligence:
    build: ../../../..
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CONFIG_PATH: config.quarkus-i2.yaml
    volumes:
      - ./declarations:/app/declarations:ro
      - ./config.quarkus-i2.yaml:/app/config.quarkus-i2.yaml:ro
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
    volumes:
      - neo4j-quarkus-i2-data:/data
      - neo4j-quarkus-i2-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      architecture-intelligence:
        condition: service_healthy

  # --- Quarkus Super Heroes infra (unchanged from the pinned repo's own compose) ---

  fights-db:
    image: mongo:8
    container_name: fights-db
    ports:
      - "27017"
    environment:
      MONGO_INITDB_DATABASE: fights
      MONGO_INITDB_ROOT_USERNAME: super
      MONGO_INITDB_ROOT_PASSWORD: super
    volumes:
      - ${QUARKUS_SUPERHEROES_CHECKOUT:?set QUARKUS_SUPERHEROES_CHECKOUT to your pinned-commit checkout}/rest-fights/deploy/db-init/initialize-database.js:/docker-entrypoint-initdb.d/1-init-db.js

  apicurio:
    image: quay.io/apicurio/apicurio-registry:3.1.7
    container_name: apicurio
    ports:
      - "8086:8086"
    environment:
      REGISTRY_AUTH_ANONYMOUS_READ_ACCESS_ENABLED: "true"
      QUARKUS_HTTP_PORT: 8086

  fights-kafka:
    image: apache/kafka-native:4.2.0
    container_name: fights-kafka
    depends_on:
      - apicurio
    ports:
      - "9092:9092"
    environment:
      LOG_DIR: /tmp/logs
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://fights-kafka:9092
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

  villains-db:
    image: postgres:18
    container_name: villains-db
    ports:
      - "5432"
    environment:
      POSTGRES_USER: superbad
      POSTGRES_PASSWORD: superbad
      POSTGRES_DB: villains_database
    volumes:
      - ${QUARKUS_SUPERHEROES_CHECKOUT:?set QUARKUS_SUPERHEROES_CHECKOUT to your pinned-commit checkout}/rest-villains/deploy/db-init/initialize-tables.sql:/docker-entrypoint-initdb.d/1-init-tables.sql

  heroes-db:
    image: postgres:18
    container_name: heroes-db
    ports:
      - "5432"
    environment:
      POSTGRES_USER: superman
      POSTGRES_PASSWORD: superman
      POSTGRES_DB: heroes_database
    volumes:
      - ${QUARKUS_SUPERHEROES_CHECKOUT:?set QUARKUS_SUPERHEROES_CHECKOUT to your pinned-commit checkout}/rest-heroes/deploy/db-init/initialize-tables.sql:/docker-entrypoint-initdb.d/1-init-tables.sql

  locations-db:
    image: mariadb:11.5
    container_name: locations-db
    ports:
      - "3306"
    environment:
      MARIADB_USER: locations
      MARIADB_PASSWORD: locations
      MARIADB_DATABASE: locations_database
      MARIADB_ROOT_PASSWORD: locations
      MARIADB_SKIP_TEST_DB: yes
    volumes:
      - ${QUARKUS_SUPERHEROES_CHECKOUT:?set QUARKUS_SUPERHEROES_CHECKOUT to your pinned-commit checkout}/grpc-locations/deploy/db-init/initialize-tables.sql:/docker-entrypoint-initdb.d/1-init-tables.sql

  # --- The four validated REST services + the unsupported gRPC/messaging boundary services ---
  # Image tags: local builds from runbook.md phase 3, never quay.io's :java25-latest.

  rest-fights-java25:
    image: quarkus-super-heroes/rest-fights:8ea0337
    container_name: rest-fights-java25
    depends_on:
      - fights-db
      - apicurio
      - fights-kafka
    ports:
      - "8082:8082"
    environment:
      QUARKUS_MONGODB_HOSTS: fights-db:27017
      KAFKA_BOOTSTRAP_SERVERS: PLAINTEXT://fights-kafka:9092
      QUARKUS_LIQUIBASE_MONGODB_MIGRATE_AT_START: "false"
      QUARKUS_MONGODB_CREDENTIALS_USERNAME: superfight
      QUARKUS_MONGODB_CREDENTIALS_PASSWORD: superfight
      QUARKUS_STORK_HERO_SERVICE_SERVICE_DISCOVERY_ADDRESS_LIST: rest-heroes:8083
      QUARKUS_STORK_VILLAIN_SERVICE_SERVICE_DISCOVERY_ADDRESS_LIST: rest-villains:8084
      QUARKUS_STORK_NARRATION_SERVICE_SERVICE_DISCOVERY_ADDRESS_LIST: rest-narration:8087
      QUARKUS_GRPC_CLIENTS_LOCATIONS_HOST: grpc-locations
      QUARKUS_GRPC_CLIENTS_LOCATIONS_PORT: 8089
      MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_APICURIO_REGISTRY_URL: http://apicurio:8086/apis/registry/v2
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      QUARKUS_OTEL_RESOURCE_ATTRIBUTES: app=rest-fights,application=fights-service,system=quarkus-super-heroes,deployment.environment.name=quarkus-i2
    restart: on-failure
    networks:
      default:
        aliases:
          - rest-fights

  rest-villains-java25:
    image: quarkus-super-heroes/rest-villains:8ea0337
    container_name: rest-villains-java25
    depends_on:
      - villains-db
    ports:
      - "8084:8084"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://villains-db:5432/villains_database
      QUARKUS_HIBERNATE_ORM_SCHEMA_MANAGEMENT_STRATEGY: validate
      QUARKUS_DATASOURCE_USERNAME: superbad
      QUARKUS_DATASOURCE_PASSWORD: superbad
      QUARKUS_HIBERNATE_ORM_SQL_LOAD_SCRIPT: no-file
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      QUARKUS_OTEL_RESOURCE_ATTRIBUTES: app=rest-villains,application=villains-service,system=quarkus-super-heroes,deployment.environment.name=quarkus-i2
    restart: on-failure
    networks:
      default:
        aliases:
          - rest-villains

  rest-heroes-java25:
    image: quarkus-super-heroes/rest-heroes:8ea0337
    container_name: rest-heroes-java25
    depends_on:
      - heroes-db
    ports:
      - "8083:8083"
    environment:
      QUARKUS_DATASOURCE_REACTIVE_URL: postgresql://heroes-db:5432/heroes_database
      QUARKUS_HIBERNATE_ORM_SCHEMA_MANAGEMENT_STRATEGY: validate
      QUARKUS_DATASOURCE_USERNAME: superman
      QUARKUS_DATASOURCE_PASSWORD: superman
      QUARKUS_HIBERNATE_ORM_SQL_LOAD_SCRIPT: no-file
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      QUARKUS_OTEL_RESOURCE_ATTRIBUTES: app=rest-heroes,application=heroes-service,system=quarkus-super-heroes,deployment.environment.name=quarkus-i2
    restart: on-failure
    networks:
      default:
        aliases:
          - rest-heroes

  rest-narration-java25:
    image: quarkus-super-heroes/rest-narration:8ea0337
    container_name: rest-narration-java25
    ports:
      - "8087:8087"
    environment:
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      QUARKUS_OTEL_RESOURCE_ATTRIBUTES: app=rest-narration,application=narration-service,system=quarkus-super-heroes,deployment.environment.name=quarkus-i2
      # Deliberately NOT setting -Dquarkus.profile=openai (I2 spec §20) - OpenAI integration stays
      # disabled (the pinned default), so this profile makes no live external generative-AI call.
    restart: on-failure
    networks:
      default:
        aliases:
          - rest-narration

  grpc-locations-java25:
    image: quarkus-super-heroes/grpc-locations:8ea0337
    container_name: grpc-locations-java25
    depends_on:
      - locations-db
    ports:
      - "8089:8089"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:mariadb://locations-db:3306/locations_database
      QUARKUS_HIBERNATE_ORM_SCHEMA_MANAGEMENT_STRATEGY: validate
      QUARKUS_DATASOURCE_USERNAME: locations
      QUARKUS_DATASOURCE_PASSWORD: locations
      QUARKUS_HIBERNATE_ORM_SQL_LOAD_SCRIPT: no-file
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      QUARKUS_OTEL_RESOURCE_ATTRIBUTES: app=grpc-locations,application=grpc-locations,system=quarkus-super-heroes,deployment.environment.name=quarkus-i2
    restart: on-failure
    networks:
      default:
        aliases:
          - grpc-locations

  event-statistics-java25:
    image: quarkus-super-heroes/event-statistics:8ea0337
    container_name: event-statistics-java25
    depends_on:
      - apicurio
      - fights-kafka
    ports:
      - "8085:8085"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: PLAINTEXT://fights-kafka:9092
      MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_APICURIO_REGISTRY_URL: http://apicurio:8086/apis/registry/v2
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      QUARKUS_OTEL_RESOURCE_ATTRIBUTES: app=event-statistics,application=event-stats,system=quarkus-super-heroes,deployment.environment.name=quarkus-i2
    restart: on-failure
    networks:
      default:
        aliases:
          - event-statistics

volumes:
  neo4j-quarkus-i2-data:
  neo4j-quarkus-i2-logs:

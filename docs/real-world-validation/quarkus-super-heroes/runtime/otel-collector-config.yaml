# OpenTelemetry Collector configuration for the Quarkus Super Heroes I2 validation profile.
#
# Adapted from examples/runtime-demo/otel-collector-config.yaml (this repo's own Collector
# fanout pattern) - same shape, same AIP-facing exporter, same compression gotcha. Every pinned
# service (docker-compose.yml) already exports OTLP/HTTP natively
# (quarkus.otel.exporter.otlp.protocol=http/protobuf); no source-code instrumentation change is
# required (I2 spec §16-17) - this Collector only routes that existing export to AIP.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 100

exporters:
  # The only required leg: forwards every trace batch to AIP's OTLP ingestion boundary.
  # `endpoint` is the base URL - the exporter appends /v1/traces itself.
  otlphttp/aip:
    endpoint: http://architecture-intelligence:8000
    tls:
      insecure: true
    # AIP's `/v1/traces` reads the raw request body as an uncompressed protobuf message - it
    # doesn't negotiate Content-Encoding, so compression must be disabled on this leg. The
    # exporter's default (gzip) would otherwise make every export a 400.
    compression: none

  # Stands in for "an additional tracing backend" (this profile has no primary observability
  # stack of its own) - prints received spans to the Collector's own stdout, useful for confirming
  # traffic actually arrived while following the runbook.
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/aip, debug]

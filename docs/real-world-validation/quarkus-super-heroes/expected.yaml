unsupported:
  - id: qsh-grpc-locations
    mechanism: grpc
    description: >
      rest-fights calls the Location service (grpc-locations) via gRPC
      (locationservice-v1.proto). AIP v0.3 has no gRPC/protobuf ingestion adapter - this
      dependency must remain UNSUPPORTED, never translated into an HTTP CALLS relation
      (I2 spec §12).

  - id: qsh-kafka-fights-topic
    mechanism: kafka-topic
    description: >
      rest-fights publishes fight events to Kafka topic "fights"; event-statistics consumes
      from the same topic. A one-producer/one-consumer topic is not assumed to map onto AIP's
      Queue semantics merely because the multiplicities match - service:event-statistics and
      SENDS/RECEIVES_FROM are in the qualifying comparison scope above (with no expected
      SENDS/RECEIVES_FROM facts) precisely so that a false Queue mapping of this topic would
      surface as an observable INCORRECT_SUPPORTED finding rather than silently falling outside
      scope (I2 spec §13-14, PR #39 review F2).

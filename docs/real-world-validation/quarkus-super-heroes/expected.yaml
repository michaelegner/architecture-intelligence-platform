# Frozen expected supported facts for quarkus-super-heroes (I2.1/I2.2 - I1 §17 schema).
#
# Ground truth established independently in ground-truth.md / evidence/ BEFORE any AIP run against
# this system (I1 §5/§36). Do not edit after the first qualifying I2.3 comparison run except per
# the ground-truth change policy (I1 §37 / ground-truth.md's "Change log").
#
# Scope note (PR #39 review F1/F2): the qualifying profile imports each service's complete pinned
# OpenAPI document, not a curated subset - under the I1 scope contract (ScopeDeclaration.contains:
# in scope iff relation type allowed AND source-or-target is a scoped entity), every PROVIDES fact
# for a scoped service becomes comparable, whether or not it is asserted here. So the PROVIDES set
# below is the *complete* provider inventory for all four pinned OpenAPI documents, not just the
# operations rest-fights happens to call - anything less would make legitimate, unlisted provider
# operations surface as false INCORRECT_SUPPORTED findings once I2.3 runs.
#
# service:event-statistics and SENDS/RECEIVES_FROM are in scope (with no expected SENDS/
# RECEIVES_FROM facts) so that an incorrect future Queue mapping of the Kafka "fights" topic
# becomes an observable "unexpected in-scope" INCORRECT_SUPPORTED finding, rather than silently
# falling outside the qualifying comparison scope (PR #39 review F2).


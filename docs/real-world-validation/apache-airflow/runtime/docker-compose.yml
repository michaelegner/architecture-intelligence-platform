# Apache Airflow I3 validation profile (I3 spec §2394-2420, runbook.md).
#
# Base: the pinned official `airflow-core/docs/howto/docker-compose/docker-compose.yaml` @
# 3adbbe1c58e4532df1964cb7794805e763816ee8 (fetched fresh, never vendored - I1 §36/§39). Unlike
# Quarkus (I2.2), no external checkout is needed: Airflow ships prebuilt release images, so nothing
# is built from source here.
#
# Four things deliberately differ from the official file, all for the same reason PR #40's review
# F1 established for Quarkus - a "reproducible runtime profile" pins every image it controls to the
# same bytes on every run, not only the system under test:
#
#   1. AIRFLOW_IMAGE_NAME is pinned to an exact apache/airflow:3.3.1 digest (not the moving
#      apache/airflow:3.3.1 tag alone, and never `:latest`).
#   2. postgres:16 (major-only in the official file) is tightened to the exact patch resolved at
#      research time, postgres:16.15.
#   3. redis:7.2-bookworm (PR #45 review F5: a Debian codename tag is not byte-pinned - patch-level
#      rebuilds of the same tag are possible) is pinned by the exact digest resolved at research
#      time.
#   4. otel-collector is pinned by digest, same image already used in
#      quarkus-super-heroes/runtime/docker-compose.yml, since it sits directly on the OTLP evidence
#      path (Airflow spans -> Collector -> AIP /v1/traces).
#
# Standard OTel env vars (never the deprecated otel_host/otel_port/otel_service/otel_ssl_active keys
# - ground-truth.md's identity finding) are added to airflow-common-env so every component (except
# airflow-init, which does no runtime work) exports traces to our own Collector, tagged with the
# `deployment.environment.name` resource attribute AIP's /v1/traces requires to accept a span
# (app/telemetry/adapter.py drops any span missing it rather than guessing an environment). No
# per-role OTEL_SERVICE_NAME is set (frozen Logical Service boundary decision, profile.md).
#
# FERNET_KEY must be exported (`export FERNET_KEY=$(python3 -c "import base64, os;
# print(base64.urlsafe_b64encode(os.urandom(32)).decode())")` - stdlib only, no extra package
# required) - see runbook.md phase 2.
#
# `logs`/`config`/`plugins` are named Docker volumes, not host bind mounts (PR #45 review F2: a host
# bind mount is never removed by `docker compose down -v`, so generated Airflow logs/config and any
# diagnostic plugin would silently survive a "clean-state" reset). `dags` stays a host bind mount -
# it holds this repo's own authored deliverable (`dags/i3_validation.py`), not generated state.

x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.3.1@sha256:0c4bcc0370e526de1b7892a3bf4343d260c6c82359c66f77155b53cd773d6339}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:?set FERNET_KEY (stdlib-only command in runbook.md phase 2)}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
    # --- I3 additions: native OTel tracing (I3 spec §28), standard env vars only ---
    AIRFLOW__TRACES__OTEL_ON: 'True'
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    # Airflow's own configure_otel() (shared/observability/src/airflow_shared/observability/traces)
    # does NOT read OTEL_EXPORTER_OTLP_PROTOCOL to pick the exporter - it reads OTEL_TRACES_EXPORTER
    # (an entry-point name: "otlp" default = OTLP/gRPC, "otlp_proto_http" = OTLP/HTTP) via its own
    # _load_exporter_from_env(). Without this, the default gRPC exporter dials the Collector's HTTP
    # port and fails ("Failed parsing HTTP/2 ... Trying to connect an http1.x server") - found by
    # actually running Phase B, not documented anywhere in the pinned config template.
    OTEL_TRACES_EXPORTER: otlp_proto_http
    OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=airflow-i3
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - airflow-i3-logs:/opt/airflow/logs
    - airflow-i3-config:/opt/airflow/config
    - airflow-i3-plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  redis:
    # Redis is limited to 7.2-bookworm due to licencing change
    # https://redis.io/blog/redis-adopts-dual-source-available-licensing/
    # (verbatim from the pinned official Compose file's own comment - not modified, see runtime/README.md)
    image: redis:7.2-bookworm@sha256:74566c6910d13ae61e7ce73ebd3127438a1fe805b309b097c323142719ec8a5b
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      test: ["CMD-SHELL", 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      # Required to handle warm shutdown of the celery workers properly
      DUMB_INIT_SETSID: "0"
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        /entrypoint airflow version
        /entrypoint airflow config list >/dev/null
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"

  # --- AIP itself (mirrors docker-compose.demo.yml / quarkus-super-heroes/runtime/docker-compose.yml) ---

  architecture-intelligence:
    build: ../../../..
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?export NEO4J_PASSWORD before starting - see runbook.md phase 2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CONFIG_PATH: config.airflow-i3.yaml
    volumes:
      - ./declarations:/app/declarations:ro
      - ./config.airflow-i3.yaml:/app/config.airflow-i3.yaml:ro
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:5.26.0
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?export NEO4J_PASSWORD before starting - see runbook.md phase 2}
    volumes:
      - neo4j-airflow-i3-data:/data
      - neo4j-airflow-i3-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector:0.159.0@sha256:7725a7a10c87d8853208bdd4bb3439ad3c0d7b32b4292b9300ac07c8daba14a2
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      architecture-intelligence:
        condition: service_healthy

volumes:
  postgres-db-volume:
  neo4j-airflow-i3-data:
  neo4j-airflow-i3-logs:
  airflow-i3-logs:
  airflow-i3-config:
  airflow-i3-plugins:

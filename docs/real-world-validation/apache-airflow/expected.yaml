# `queue:default` is deliberately in scope with relation_types PROVIDES/SENDS/RECEIVES_FROM but
# carries NO expected SENDS/RECEIVES_FROM relation above (I3 spec §22-24, mirroring Quarkus's
# I2.1 Kafka-topic boundary test): if AIP emits any SENDS/RECEIVES_FROM touching queue:default
# before I3 has independently qualified the Celery flow with real runtime evidence, the I1
# comparator reports it as an unexpected in-scope fact (INCORRECT_SUPPORTED) rather than staying
# silent. The producer/consumer Service identity for that flow is intentionally left unresolved
# (ground-truth.md's "Multiple runtime instances" / Logical Service boundary decision) rather than
# guessed here.

# Mechanisms present upstream but outside AIP's current supported semantic scope (I1 §12.4, I3
# spec §25).
unsupported:
  - id: airflow-scheduler-postgres-dependency
    mechanism: database-dependency
    description: >
      airflow-scheduler depends on PostgreSQL as its metadata database, which is outside the
      current AIP canonical relation vocabulary.
  - id: airflow-apiserver-postgres-dependency
    mechanism: database-dependency
    description: >
      airflow-apiserver depends on PostgreSQL as its metadata database, which is outside the
      current AIP canonical relation vocabulary.
  - id: airflow-celery-result-backend-postgres-dependency
    mechanism: database-dependency
    description: >
      The Celery result backend is configured as PostgreSQL, which is outside the current AIP
      canonical relation vocabulary.

# Relationships independent evidence suggests exist, but whose canonical identity AIP cannot
# safely resolve without guessing (I1 §12.5, I3 spec §19/§43).
unresolved_identity:
  - id: airflow-execution-api-boundary
    description: >
      The pinned Airflow source independently defines the private Execution API and concrete
      target routes (airflow-core/src/airflow/api_fastapi/execution_api/), but a supported CALLS
      fact is not frozen in I3.1 because the worker/task-runner caller identity is unresolved
      (see airflow-runtime-role-identity below) and the qualifying scope has not yet been
      deliberately extended to this second contract surface (see ground-truth.md's "Execution API
      boundary" §19). I3.2 SHALL revisit the boundary using the validation workload and
      independent runtime evidence before I3.3.
  - id: airflow-runtime-role-identity
    description: >
      airflow-scheduler, airflow-dag-processor, airflow-worker, and airflow-triggerer are
      architecturally distinct roles (see ground-truth.md's Logical Service boundary analysis),
      but the pinned official profile's default OTel configuration does not set a per-role
      service.name/resource identity, so none of the four is asserted as a distinct canonical
      Service in this qualifying profile.

# Facts this dossier's own evidence cannot establish strongly enough to use as ground truth (I1
# §12.6, I3 spec §23/§45-46).
insufficient_evidence:
  - id: airflow-celery-messaging-runtime-status
    description: >
      I3.2 exercised real traffic and captured real telemetry (ground-truth.md's Change log):
      native Airflow tracing exposes zero Celery/broker/queue attributes. A diagnostic-only,
      spec-§29-permitted addition of standard opentelemetry-instrumentation-celery did surface a
      producer-side span confirming the destination is a queue named "default", but every span's
      resource service.name was "unknown_service" regardless of component - sender/consumer
      identity is not resolvable from this profile's OTel configuration, which I3 spec §23 requires
      as a precondition independent of messaging-attribute quality. This is now a final result, not
      an open question pending more evidence.

# Frozen expected facts for quarkus-super-heroes (v0.5.0 I5 §§6-8, spec Draft 0.3).
#
# This file was drafted from ground-truth.md alone, from upstream evidence at the pin, before any
# qualifying AIP output for this target was inspected. The owner's merge of the dossier PR freezes
# it (I5 §6). Every entry cites its upstream source in ground-truth.md, under the same id.
#
# Schema: real_world_validation/README.md ("v0.5.0 additions") and real_world_validation/loader.py.
#
# Scope closure (I5 §7). SENDS, PUBLISHES_TO and RECEIVES_FROM are in scope for all five services,
# but this file expects no fact of those types. Any such fact AIP emits for these services, whatever
# its Queue, Topic or Subscription target id, is therefore an unexpected in-scope fact, and so
# INCORRECT_SUPPORTED. That covers the Kafka `fights` negative for Topic and Subscription targets,
# whose ids are opaque owner hashes a dossier cannot name. The explicit `forbidden.relations`
# entries add a named negative proof for the name-derived `queue:fights` id.


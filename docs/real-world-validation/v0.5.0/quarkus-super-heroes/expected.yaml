forbidden:
  relations:
    # Kafka `fights` must never be coerced into a Queue (I5 §8.1). See also the scope closure above.
    - {id: qsh-no-fights-queue-send, type: SENDS, source: service:rest-fights, target: "queue:fights"}
    - {id: qsh-no-fights-queue-receive, type: RECEIVES_FROM, source: service:event-statistics, target: "queue:fights"}
  deployments:
    # The real-target name-only negative (I5 §8.1): same name, no annotation, no mapping.
    - id: qsh-no-name-only-rest-narration
      service: service:rest-narration
      workload: {namespace: quarkus-super-heroes, kind: DEPLOYMENT, name: rest-narration}
    # event-statistics is not a declared Service, and its Deployment has no annotation or mapping.
    - id: qsh-no-name-only-event-statistics
      service: service:event-statistics
      workload: {namespace: quarkus-super-heroes, kind: DEPLOYMENT, name: event-statistics}

unsupported:
  - id: qsh-grpc-locations
    mechanism: grpc
    description: >
      rest-fights calls grpc-locations over gRPC (LocationClient, @GrpcClient("locations")). v0.5
      has no gRPC semantics, so this must never become an HTTP CALLS, Queue or Pub/Sub fact.
  - id: qsh-kafka-fights-topic
    mechanism: kafka-topic
    description: >
      rest-fights emits to Kafka topic "fights" and event-statistics consumes it, with no upstream
      AsyncAPI. v0.5 admits Pub/Sub only from declarations, and runtime observation never mints a
      Topic or Subscription (I4). The consumer group is never a Subscription. So there is no Queue,
      Topic, Subscription, SENDS, PUBLISHES_TO or RECEIVES_FROM fact for "fights".
  - id: qsh-kafka-legacy-operation-key
    mechanism: otel-messaging-operation-legacy-key
    description: >
      The producer's spans carry only the legacy `messaging.operation` key. The I4 §9 operation key
      is not widened, so these spans stay unsupported and create no fact.

# AIP configuration for the Apache Airflow v0.5.0 I5 profile (profile.md). Every value here is AIP
# operator configuration (I5 §6). Paths are relative to the AIP container's working directory
# (/app), where docker-compose.yml mounts them. Airflow has no Kubernetes input and no Path B
# mapping in I5 (I5 §5).
architecture_intelligence:
  sources:
    directories:
      - id: airflow-v0.5-declarations
        root: declarations
  graph:
    uri: bolt://localhost:7687
    database: neo4j
    max_traversal_depth: 5
  import:
    openapi: true
    asyncapi: true
    architecture_manifest: true
  llm:
    enabled: false
  intent_router:
    deterministic_threshold: 0.9
  telemetry:
    service_aliases: {}
    queue_aliases: {}
    topic_aliases: {}
    http-correlation:
      enabled: true
      ttl-seconds: 60
      max-pending-spans: 10000
    coverage:
      qualification-enabled: true
  runtime_analysis:
    default_window_hours: 24
    default_environment: airflow-i5

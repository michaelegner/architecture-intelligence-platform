    pointer: /components/schemas/OrderRequest
    schemaId: "schema:OrderRequest"
  - sourceInstanceId: urn:aip:source:filesystem:a302361f5e4b2b86839e1b2da03c9691ddba8a7bcc22a21c0270ef80ece247bf

# I1 spec §5.1.1: "The v0.5.0 migration configuration for repository-owned examples SHALL use
# these fixed logical identities" - migration mapping artifact id
# aip-v0.5.0-bundled-example-identities-v1, binding the bundled examples/ fixtures' constructs to
# their prior (pre-PR3a, v0.4.2-era) canonical Schema/Message/Queue IDs, per §8.1/§9/§9.1's
# explicit shared-identity mapping mechanism.
#
# `sourceInstanceId` values are independently reproducible from
# `app.sources.identity.source_instance_id(configured_source_id="aip-bundled-examples-v0.5",
# source_kind=filesystem, normalized_root_document_path=<path below>)` - never hand-derived.
#
# Legacy target ids are the exact output of the pre-PR3a `app.canonical.ids.schema_id`/
# `message_id`/`queue_id` functions (see `git show 7492bd2^:app/canonical/ids.py`, `7492bd2` being
# PR3a's merge commit) applied to each construct's pre-existing name/version - not invented values.
#
# Deliberately NOT referenced by config.yaml/config.demo.yaml's own `sources.migrations` list: this
# artifact exists and is proven correct (tests/integration/test_i1_bundled_migration_determinism.py)
# without being applied by default, since applying it would revert the bundled examples' real,
# already-shipped owner-scoped identity (PR3a/3b) back to these legacy ids for every default
# consumer of the config file - see config.yaml's own comment at this key.
apiVersion: aip.dev/v1
kind: AipSharedIdentityMappings
metadata:
  id: aip-v0.5.0-bundled-example-identities-v1
  revision: v1

schemaMappings:
  # order-service/openapi.yaml
  - sourceInstanceId: urn:aip:source:filesystem:a302361f5e4b2b86839e1b2da03c9691ddba8a7bcc22a21c0270ef80ece247bf
    pointer: /components/schemas/OrderRequest
    schemaId: "schema:OrderRequest"
  - sourceInstanceId: urn:aip:source:filesystem:a302361f5e4b2b86839e1b2da03c9691ddba8a7bcc22a21c0270ef80ece247bf

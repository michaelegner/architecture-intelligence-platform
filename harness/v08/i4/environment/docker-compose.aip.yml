# v0.8 I4 §5: the AIP instance the agent queries, started by the operator from the run home (outside
# the AIP checkout). The image is built from the I4a merge commit and tagged `aip:v08-i4` (README).
# The run home's `aip/config.yaml` is the before- or after-wave profile, and `aip/inputs/` holds only
# the inputs of that phase (I4 §5: no after-wave input before S4).
name: aip-v08-i4-aip

services:
  app:
    image: aip:v08-i4
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CONFIG_PATH: /app/run/config.yaml
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${AIP_NEO4J_PASSWORD:?set AIP_NEO4J_PASSWORD}
    volumes:
      - ./aip/config.yaml:/app/run/config.yaml:ro
      - ./aip/inputs:/app/sokol111-v08:ro
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:5.26.32@sha256:f1e52d4dc6da122468c4a3c1050a4f5e117f6d3268625237c34d49166f0d6082
    environment:
      NEO4J_AUTH: neo4j/${AIP_NEO4J_PASSWORD:?set AIP_NEO4J_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

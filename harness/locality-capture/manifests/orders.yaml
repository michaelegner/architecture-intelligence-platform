# Caller Workload orders (I1 capture runbook §§2-3): a separate Deployment of the same image with
# service.name=orders, calling pricing. k8s.pod.uid, the Pod name and namespace come from the Downward
# API; k8s.cluster.uid is the kube-system Namespace UID, substituted at apply time (${CLUSTER_UID}).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: aip-locality
  annotations: {architecture-intelligence.io/service-id: "service:orders"}
spec:
  replicas: 1
  selector: {matchLabels: {app: orders}}
  template:
    metadata: {labels: {app: orders}}
    spec:
      containers:
        - name: orders
          image: aip-locality-harness:rehearsal
          imagePullPolicy: Never
          env:
            - {name: ROLE, value: caller}
            - {name: TARGET, value: pricing}
            - {name: TARGET_PEER_SERVICE, value: pricing}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: OTEL_SERVICE_NAME, value: orders}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment.name=locality-capture,k8s.pod.uid=$(POD_UID),k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.deployment.name=orders,k8s.cluster.uid=${CLUSTER_UID}"
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318"}
            - {name: OTEL_SEMCONV_STABILITY_OPT_IN, value: http}

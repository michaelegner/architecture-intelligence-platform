# Clean offline replay of the rehearsal recording (I1 capture runbook §6). One AIP, one Neo4j and
# the replay Collector, on non-default host ports so a developer's demo stack is left alone.
# REPLAY_DIR (set by run-replay.sh) holds config.yaml, declarations/ and capture/ for one state.
name: aip-locality-replay
services:
  architecture-intelligence:
    build: ../../..
    ports: ["18000:8000"]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      OPENAI_API_KEY: ""
      CONFIG_PATH: rehearsal/config.yaml
    volumes:
      - ${REPLAY_DIR:?set REPLAY_DIR}:/app/rehearsal:ro
      - ./evaluate.py:/app/rehearsal-tools/evaluate.py:ro
    depends_on:
      neo4j: {condition: service_healthy}
    healthcheck: {interval: 1s}
  neo4j:
    image: neo4j:5.26.31@sha256:5eb12ad77fa46ab73e23df9ea1f43f5c0f2a79523435577648e046be042b9b93
    ports: ["17687:7687"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 1s
      timeout: 5s
      retries: 20
      start_period: 60s
      start_interval: 1s
  replay-collector:
    image: otel/opentelemetry-collector:0.161.0@sha256:b6d2b9a85b1029d05b5ad913150c1f014eed4ae99be81a1813ca5ade4a191913
    command: ["--config=/etc/otelcol/collector-replay.yaml"]
    volumes: ["./collector-replay.yaml:/etc/otelcol/collector-replay.yaml:ro"]
    ports: ["14318:4318"]
    depends_on:
      architecture-intelligence: {condition: service_healthy}
